spring.application.name=game-journal-api
spring.datasource.url=jdbc:postgresql://localhost:5432/gamesdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.config.import=optional:file:${user.home}/.config/game-journal/twitch.properties, optional:file:${user.home}/.config/game-journal/supabase.properties

app.storage.supabase.url=${SUPABASE_URL}
app.storage.supabase.secret-key=${SUPABASE_SECRET_KEY}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB